schema_version: '2.0'
title: Tuberculosis Target Workflow Visualisation
description: 'Presentation model for the multi-stage Boltz Workflow: Tuberculosis
  Target workflow.'
standard: other
tags:
- boltz-workflow
- docking
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.docking_visualisation:DockingVisualisationModel
  init_kwargs:
    integration_step: 0.01
    source_alias: boltz_boltz2_affinity_predictor
    mode: boltz
    lab_title: 'Boltz Workflow: Tuberculosis Target'
    context_alias: tuberculosis_target_context
    assembler_alias: inha_ligand_setup
    interpreter_alias: tb_prediction_interpreter
  communication_step: 0.01
parameters:
- name: integration_step
  value: 0.01
  min: 0.0
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: tuberculosis_target_context_scenario_context
    description: Workflow context from the context stage.
  - name: inha_ligand_setup_assembled_boltz_request
    description: Traceable request summary from input assembly.
  - name: tb_prediction_interpreter_prediction_evidence
    description: Conservative interpreted prediction evidence.
  - name: boltz_boltz2_affinity_predictor_affinity_summary
    description: Raw affinity_summary output from the Boltz prediction stage.
  - name: boltz_boltz2_affinity_predictor_confidence_summary
    description: Raw confidence_summary output from the Boltz prediction stage.
  - name: boltz_boltz2_affinity_predictor_structure_artifacts
    description: Raw structure_artifacts output from the Boltz prediction stage.
  - name: boltz_boltz2_affinity_predictor_run_metadata
    description: Raw run_metadata output from the Boltz prediction stage.
  outputs: []
