- alias: acceptance
  path: models/acceptance
  parameters: {}
- alias: ranking
  path: models/ranking
  parameters: {}
wiring:
- from: source.provider_results
  to:
  - acceptance.provider_results
- from: acceptance.acceptance
  to:
  - ranking.acceptance
runtime:
  python_version: '3.11'
  duration: 0.01
  communication_step: 0.01
  settle_steps: 1
io:
  inputs: []
  outputs:
  - name: experiment_report
    maps_to: ranking.report
  - name: acceptance_passed
    maps_to: ranking.accepted
caveats:
- Research predictions, not experimental binding or clinical evidence.
- Ligand heavy-element inventory does not establish connectivity, stereochemistry
  or pose accuracy.
- NIM seed, checkpoint hash and hosting hardware are not exposed.
- Receipt hashes identify captured bytes; NVIDIA has not cryptographically signed
  these responses.
- Query-only MSA supplies no evolutionary homologs.
- Native affinity score and provider affinity_pic50 remain separate fields.
- NVIDIA inference executes in the agent environment; this Lab validates recorded
  responses. Structural gateway compatibility is not semantic scientific validation.
  Acceptance is model-specific code in this Lab; no platform-wide release is claimed.
