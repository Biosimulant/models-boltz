schema_version: '2.0'
package: local/boltz-scientific-acceptance
version: 0.1.0
title: Boltz with explicit scientific interfaces and output acceptance
description: Research workflow. Acceptance validates declared output requirements,
  not binding or biological accuracy.
models:
- alias: prediction
  parameters:
    accelerator: gpu
    default_ligand_smiles: N[C@@H](Cc1ccc(O)cc1)C(=O)O
    default_msa_path: assets/seq1.a3m
    default_protein_sequence: 
    diffusion_samples: 1
    output_format: mmcif
    override: true
    recycling_steps: 3
    runtime_mode: managed
    sampling_steps: 200
    use_msa_server: false
  path: models/core
- alias: analysis
  path: models/analysis
wiring:
- from: prediction.binding_probability
  to:
  - analysis.binding_probability
- from: prediction.affinity_log10_ic50_micromolar
  to:
  - analysis.affinity_log10_ic50_micromolar
- from: prediction.predicted_structure
  to:
  - analysis.predicted_structure
- from: prediction.requested_protein_sequence
  to:
  - analysis.requested_protein_sequence
- from: prediction.requested_ligand_smiles
  to:
  - analysis.requested_ligand_smiles
- from: prediction.requested_chains
  to:
  - analysis.requested_chains
runtime:
  python_version: '3.10'
  communication_step: 0.01
  duration: 0.01
  initial_inputs: {}
  settle_steps: 1
io:
  inputs:
  - maps_to: prediction.protein_sequence
    value_type: string
    format: sequence
    required: false
    ui:
      control: textarea
      rows: 6
    name: protein_sequence
    label: Target Protein Sequence
    description: Amino-acid sequence passed directly to the Boltz-2 protein input.
  - maps_to: prediction.ligand_smiles
    value_type: string
    format: smiles
    required: false
    ui:
      control: textarea
      rows: 3
    name: ligand_smiles
    label: Ligand SMILES
    description: Ligand structure encoded as a SMILES string and passed directly to
      Boltz-2.
  - maps_to: prediction.msa_path
    value_type: file
    format: a3m
    required: false
    file:
      accept:
      - .a3m
    ui:
      control: file
    name: msa_path
    label: Precomputed MSA Path
    description: Optional A3M override. Its query sequence must match the protein
      input; the packaged matching A3M is used by default.
  - maps_to: prediction.run_options.use_msa_server
    name: use_msa_server
    label: Use MSA Server
    description: Use Boltz's MSA server instead of the packaged deterministic A3M
      file.
    value_type: boolean
    default: false
  - maps_to: prediction.run_options.sampling_steps
    name: sampling_steps
    label: Sampling Steps
    description: Number of Boltz sampling steps for structure generation.
    value_type: integer
    default: 200
  - maps_to: prediction.run_options.recycling_steps
    name: recycling_steps
    label: Recycling Steps
    description: Number of structure recycling steps.
    value_type: integer
    default: 3
  - maps_to: prediction.run_options.diffusion_samples
    name: diffusion_samples
    label: Diffusion Samples
    description: Number of Boltz diffusion samples to generate.
    value_type: integer
    default: 1
  - maps_to: prediction.run_options.output_format
    name: output_format
    label: Output Format
    description: Structure artifact format emitted by Boltz.
    value_type: string
    default: mmcif
    allowed_values:
    - mmcif
  - maps_to: prediction.run_options
    value_type: record
    format: json
    required: false
    advanced: true
    ui:
      control: json
      rows: 6
    name: run_options
    label: Boltz Run Options
    description: Optional structured Boltz workflow controls such as MSA-server use,
      output format, and sampling settings.
  outputs:
  - name: binding_probability
    maps_to: prediction.binding_probability
  - name: raw_affinity_score
    maps_to: prediction.affinity_log10_ic50_micromolar
  - name: predicted_structure
    maps_to: prediction.predicted_structure
  - name: summary
    maps_to: analysis.summary
scientific_validation:
  schema_version: '1'
  required_profiles:
  - module: prediction
    direction: output
    port: binding_probability
    profile: boltz.binding-probability/v1
  - module: analysis
    direction: input
    port: binding_probability
    profile: boltz.binding-probability/v1
  - module: prediction
    direction: output
    port: affinity_log10_ic50_micromolar
    profile: boltz.log10-ic50-micromolar/v1
  - module: analysis
    direction: input
    port: affinity_log10_ic50_micromolar
    profile: boltz.log10-ic50-micromolar/v1
  - module: prediction
    direction: output
    port: predicted_structure
    profile: protein-ligand.complex-structure-mmcif/v1
  - module: analysis
    direction: input
    port: predicted_structure
    profile: protein-ligand.complex-structure-mmcif/v1
  - module: prediction
    port: requested_protein_sequence
    direction: output
    profile: protein.sequence/v1
  - module: analysis
    port: requested_protein_sequence
    direction: input
    profile: protein.sequence/v1
  - module: prediction
    port: requested_ligand_smiles
    direction: output
    profile: chemical.smiles/v1
  - module: analysis
    port: requested_ligand_smiles
    direction: input
    profile: chemical.smiles/v1
  checks:
  - id: binding_probability
    kind: profile
    source:
      module: prediction
      port: binding_probability
    profile: boltz.binding-probability/v1
  - id: affinity_log10_ic50_micromolar
    kind: profile
    source:
      module: prediction
      port: affinity_log10_ic50_micromolar
    profile: boltz.log10-ic50-micromolar/v1
  - id: predicted_structure
    kind: profile
    source:
      module: prediction
      port: predicted_structure
    profile: protein-ligand.complex-structure-mmcif/v1
  - id: predictor_completed
    kind: equals
    source:
      module: prediction
      port: run_metadata
      path:
      - payload
      - status
    expected: completed
  - id: analysis_completed
    kind: equals
    source:
      module: analysis
      port: completed
    expected: true
  - id: requested_protein_sequence
    kind: profile
    source:
      module: prediction
      port: requested_protein_sequence
    profile: protein.sequence/v1
  - id: requested_ligand_smiles
    kind: profile
    source:
      module: prediction
      port: requested_ligand_smiles
    profile: chemical.smiles/v1
intended_use: Inspect one Boltz protein-ligand prediction with explicit interfaces
  and output completeness checks.
caveats:
- Acceptance is not experimental binding evidence, model accuracy, or fitness for
  a biological use.
- Checks compare the predicted protein sequence and ligand heavy-element composition
  to requested inputs. Ligand connectivity, stereochemistry, pose accuracy and binding
  are not established.
- The default MSA only matches the packaged default protein.
- Requires the unreleased Biosimulant 0.0.36 runtime implementation. Do not publish
  before its release.
