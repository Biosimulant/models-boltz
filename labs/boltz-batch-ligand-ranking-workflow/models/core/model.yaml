schema_version: '2.0'
title: Boltz-2 Batch Ligand Ranking Workflow Runner
description: Guided wrapper that runs a small ligand CSV against one protein target
  with Boltz-2 and ranks the completed results.
package: Biosimulant/models-boltz:labs/boltz-batch-ligand-ranking-workflow/models/core/model.yaml
standard: other
tags:
- boltz
- boltz-workflow
- structural-biology
- affinity
- protein-ligand
- batch-ranking
- gpu
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.boltz2_batch_ligand_ranker:Boltz2BatchLigandRanker
runtime:
  python_version: '3.10'
  dependencies:
    packages:
      - boltz[cuda]==2.0.2
      - pyyaml==6.0.2
  remote:
    requirements:
      accelerator: gpu
      gpu_count: 1
    init_kwargs:
      runtime_mode: external
      cache_dir: ${REMOTE_EXECUTION_MOUNT_ROOT}/runtime-cache/boltz
parameters:
- name: default_protein_sequence
  value: null
  description: Fallback amino-acid sequence used when the protein_sequence input signal
    is not wired.
- name: default_ligand_csv
  value: null
  description: Fallback CSV text used when the ligand_csv input signal is not wired.
    Requires name and smiles columns.
- name: default_msa_path
  value: null
  description: Optional fallback path to a pre-computed MSA (.a3m). When null and
    use_msa_server is true, Boltz queries the configured MSA server.
- name: default_run_options
  value: {}
  description: Default Boltz batch run options merged onto any run_options input signal.
- name: max_ligands
  value: 3
  min: 1
  description: Maximum number of ligand rows to evaluate in one guided batch run.
- name: boltz_executable
  value: boltz
  description: Name of the Boltz CLI binary to invoke. Override only if the runtime
    exposes Boltz under a different name.
- name: runtime_mode
  value: managed
  description: managed | external. Managed installs Boltz into a local venv on first
    run; external assumes the runtime image already provides it.
- name: runtime_python
  value: null
  description: Optional python interpreter to use for the managed runtime install.
    Defaults to the platform's bundled python when null.
- name: boltz_package_spec
  value: null
  description: Optional pip spec for managed-runtime installs. Defaults to the version
    pinned in runtime.dependencies.packages.
- name: upgrade_runtime
  value: false
  description: Force a reinstall of the managed Boltz runtime even if it is already
    cached.
- name: accelerator
  value: gpu
  description: gpu | cpu. Boltz-2 is GPU-bound for any non-trivial input. CPU mode
    is for plumbing tests only.
- name: devices
  value: 1
  min: 1
  description: Number of accelerator devices.
- name: use_msa_server
  value: false
  description: If true, Boltz fetches MSAs from the configured server. Required when
    default_msa_path is unset.
- name: output_format
  value: mmcif
  description: Boltz output format. mmcif | pdb.
- name: override
  value: true
  description: Overwrite existing Boltz output directory if present.
- name: recycling_steps
  value: 3
  min: 1
  description: Number of structure-recycling iterations.
- name: sampling_steps
  value: 200
  min: 1
  description: Diffusion sampling steps per pose.
- name: diffusion_samples
  value: 1
  min: 1
  description: Number of diffusion samples per run.
- name: command_timeout_s
  value: 3600.0
  min: 1.0
  units: s
  description: Timeout for any single Boltz CLI invocation.
- name: runtime_setup_timeout_s
  value: 1800.0
  min: 1.0
  units: s
  description: Timeout for the managed-runtime install step.
- name: progress_heartbeat_s
  value: 30.0
  min: 0.0
  units: s
  description: Interval between BSIM_PROGRESS heartbeat events while Boltz is running.
- name: integration_step
  value: 0.01
  min: 0.001
  units: s
  description: BioWorld integration step. Boltz is event-driven so this only paces
    the wrapper.
io:
  inputs:
  - name: protein_sequence
    description: Amino-acid sequence string. Overrides default_protein_sequence when
      present.
  - name: ligand_csv
    description: CSV text with name and smiles columns plus optional metadata columns.
  - name: msa_path
    description: Optional path to a pre-computed MSA (.a3m). Overrides default_msa_path
      when present.
  - name: run_options
    description: Boltz options dict merged onto default_run_options.
  outputs:
  - name: batch_summary
    description: Ranked ligand table with binder probability, affinity-like value,
      confidence, status, and flags.
  - name: affinity_summary
    description: Parsed Boltz affinity summary for the top-ranked completed ligand.
  - name: confidence_summary
    description: Parsed Boltz confidence summary for the top-ranked completed ligand.
  - name: structure_artifacts
    description: Absolute paths to the top-ranked ligand Boltz output artifacts.
  - name: run_metadata
    description: Batch execution metadata and per-ligand statuses. payload.status='completed'
      when at least one ligand completes.
