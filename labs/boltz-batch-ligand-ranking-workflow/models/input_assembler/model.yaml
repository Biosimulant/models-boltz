schema_version: '2.0'
title: 'Boltz Workflow: Batch Ligand Ranking Input Assembly'
description: Resolves public inputs and curated defaults into exact Boltz request
  inputs.
standard: other
tags:
- boltz-workflow
- input-assembly
- provenance
authors:
- Biosimulant Team
biosim:
  entrypoint: src.boltz_input_assembler:BoltzInputAssemblerModel
  init_kwargs:
    workflow_name: Batch Ligand Ranking
    workflow_kind: batch
    default_protein_sequence: VSPNYDKWEMERTDITMKHKLGGGQYGEVYEGVWKKYSLTVAVKTLKEDTMEVEEFLKEAAVMKEIKHPNLVQLLGVCTREPPFYIITEFMTYGNLLDYLRECNRQEVNAVVLLYMATQISSAMEYLEKKNFIHRDLAARNCLVGENHLVKVADFGLSRLMTGDTYTAHAGAKFPIKWTAPESLAYNKFSIKSDVWAFGVLLWEIATYGMSPYPGIDLSQVYELLEKDYRMERPEGCPEKVYELMRACWQWNPSDRPSFAEIHQAFETMFQES
    default_ligand_csv: |
      name,smiles,source
      Imatinib,CC1=C(C=C(C=C1)NC(=O)C2=CC=C(C=C2)CN3CCN(CC3)C)NC4=NC=CC(=N4)C5=CN=CC=C5,PubChem CID 5291
      Dasatinib,CC1=C(C(=CC=C1)Cl)NC(=O)C2=CN=C(S2)NC3=CC(=NC(=N3)C)N4CCN(CC4)CCO,PubChem CID 3062316
      Nilotinib,CC1=C(C=C(C=C1)C(=O)NC2=CC(=CC(=C2)C(F)(F)F)N3C=C(N=C3)C)NC4=NC=CC(=N4)C5=CN=CC=C5,PubChem CID 644241
    default_run_options:
      workflow_name: Batch Ligand Ranking
      workflow_context: Guided Boltz-2 batch ligand ranking workflow using ABL1 kinase-domain
        examples
      interpretation_scope: Learning, small-set ranking, and early hypothesis generation
        only
      target_name: Human ABL1 kinase domain
      source_pdb: 2HYY
      ligand_examples:
      - Imatinib
      - Dasatinib
      - Nilotinib
    integration_step: 0.01
  communication_step: 0.01
runtime:
  dependencies:
    packages: []
  python_version: '3.12'
io:
  inputs:
  - name: scenario_context
    description: Workflow context from the context stage.
  - name: protein_sequence
    description: Optional protein sequence override.
  - name: ligand_csv
    description: Optional candidate ligand CSV override.
  - name: msa_path
    description: Optional precomputed MSA path.
  - name: run_options
    description: Optional Boltz run option overrides.
  outputs:
  - name: protein_sequence
    description: Resolved protein sequence passed to Boltz.
  - name: ligand_csv
    description: Resolved ligand CSV passed to Boltz.
  - name: msa_path
    description: Resolved MSA path.
  - name: run_options
    description: Merged Boltz run options.
  - name: assembled_boltz_request
    description: Traceability summary for the prepared Boltz request.
