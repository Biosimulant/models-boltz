schema_version: '2.0'
title: 'Boltz Workflow: Batch Ligand Ranking Context'
description: Source-backed target, ligand, use-case, provenance, and caveat context
  for the workflow.
standard: other
tags:
- boltz-workflow
- context
- provenance
authors:
- Biosimulant Team
biosim:
  entrypoint: src.workflow_context:WorkflowContextModel
  init_kwargs:
    scenario:
      workflow_name: Batch Ligand Ranking
      workflow_context: Guided Boltz-2 batch ligand ranking workflow using ABL1 kinase-domain
        examples
      workflow_question: How does a small ligand library rank against the shared ABL1
        kinase-domain target?
      interpretation_scope: Learning, small-set ranking, and early hypothesis generation
        only
      target_name: Human ABL1 kinase domain
      target_family: ABL1 kinase domain
      disease_area: small ligand ranking
      ligand_role: candidate ligand set
      source_pdb: 2HYY
      protein_sequence_length: 273
      caveat: Boltz-2 outputs are computational structure and affinity-style predictions
        for hypothesis generation; they are not experimental binding, potency, selectivity,
        clinical, or efficacy evidence.
    integration_step: 0.01
  communication_step: 0.01
runtime:
  dependencies:
    packages: []
  python_version: '3.12'
io:
  inputs: []
  outputs:
  - name: scenario_context
    description: Curated target, ligand, provenance, and caveat context.
