schema_version: '2.0'
title: 'Boltz Workflow: Cancer Kinase Input Assembly'
description: Resolves public inputs and curated defaults into exact Boltz request
  inputs.
standard: other
tags:
- boltz-workflow
- input-assembly
- provenance
authors:
- Biosimulant Team
biosim:
  entrypoint: src.boltz_input_assembler:BoltzInputAssemblerModel
  init_kwargs:
    workflow_name: Cancer Kinase Workflow
    workflow_kind: single
    default_protein_sequence: VSPNYDKWEMERTDITMKHKLGGGQYGEVYEGVWKKYSLTVAVKTLKEDTMEVEEFLKEAAVMKEIKHPNLVQLLGVCTREPPFYIITEFMTYGNLLDYLRECNRQEVNAVVLLYMATQISSAMEYLEKKNFIHRDLAARNCLVGENHLVKVADFGLSRLMTGDTYTAHAGAKFPIKWTAPESLAYNKFSIKSDVWAFGVLLWEIATYGMSPYPGIDLSQVYELLEKDYRMERPEGCPEKVYELMRACWQWNPSDRPSFAEIHQAFETMFQES
    default_ligand_smiles: CC1=C(C=C(C=C1)NC(=O)C2=CC=C(C=C2)CN3CCN(CC3)C)NC4=NC=CC(=N4)C5=CN=CC=C5
    default_run_options:
      workflow_name: Cancer Kinase Workflow
      workflow_context: Guided Boltz-2 known-example workflow for Human ABL1 kinase
        domain and Imatinib reference kinase inhibitor
      interpretation_scope: Learning and early hypothesis generation only
      target_name: Human ABL1 kinase domain
      ligand_name: Imatinib reference kinase inhibitor
      source_pdb: 2HYY
      source_pubchem_cid: '5291'
    integration_step: 0.01
  communication_step: 0.01
runtime:
  dependencies:
    packages: []
  python_version: '3.12'
io:
  inputs:
  - name: scenario_context
    description: Workflow context from the context stage.
  - name: protein_sequence
    description: Optional protein sequence override.
  - name: ligand_smiles
    description: Optional ligand SMILES override.
  - name: msa_path
    description: Optional precomputed MSA path.
  - name: run_options
    description: Optional Boltz run option overrides.
  outputs:
  - name: protein_sequence
    description: Resolved protein sequence passed to Boltz.
  - name: ligand_smiles
    description: Resolved ligand SMILES passed to Boltz.
  - name: msa_path
    description: Resolved MSA path.
  - name: run_options
    description: Merged Boltz run options.
  - name: assembled_boltz_request
    description: Traceability summary for the prepared Boltz request.
