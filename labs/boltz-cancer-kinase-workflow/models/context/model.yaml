schema_version: '2.0'
title: 'Boltz Workflow: Cancer Kinase Context'
description: Source-backed target, ligand, use-case, provenance, and caveat context
  for the workflow.
standard: other
tags:
- boltz-workflow
- context
- provenance
authors:
- Biosimulant Team
biosim:
  entrypoint: src.workflow_context:WorkflowContextModel
  init_kwargs:
    scenario:
      workflow_name: Cancer Kinase Workflow
      workflow_context: Guided Boltz-2 known-example workflow for Human ABL1 kinase
        domain and Imatinib reference kinase inhibitor
      workflow_question: What does Boltz-2 predict for this cancer-relevant kinase
        domain and reference ligand?
      interpretation_scope: Learning and early hypothesis generation only
      target_name: Human ABL1 kinase domain
      target_family: ABL1 kinase domain
      disease_area: cancer kinase inhibition
      ligand_name: Imatinib reference kinase inhibitor
      ligand_role: reference kinase inhibitor
      source_pdb: 2HYY
      source_pubchem_cid: '5291'
      protein_sequence_length: 273
      caveat: Boltz-2 outputs are computational structure and affinity-style predictions
        for hypothesis generation; they are not experimental binding, potency, selectivity,
        clinical, or efficacy evidence.
    integration_step: 0.01
  communication_step: 0.01
runtime:
  dependencies:
    packages: []
  python_version: '3.12'
io:
  inputs: []
  outputs:
  - name: scenario_context
    description: Curated target, ligand, provenance, and caveat context.
