schema_version: '2.0'
package: boltz-malaria-binding-workflow
version: 1.0.0
title: 'Boltz Workflow: Malaria Binding'
description: Guided Boltz-2 workflow for exploring a malaria-related falcipain-2 target
  with an E-64 reference inhibitor-like ligand example, binder probability, affinity-like
  value, confidence metrics, and reproducible report context.
tags:
- boltz-workflow
- boltz
- protein-ligand
- affinity
- structural-biology
- guided-workflow
- gpu
- malaria
- infectious-disease
- falcipain-2
models:
- alias: malaria_target_context
  path: models/context
  parameters:
    scenario:
      workflow_name: Malaria Binding Workflow
      workflow_context: Guided Boltz-2 known-example workflow for Plasmodium falciparum
        falcipain-2 cysteine protease and E-64 reference cysteine-protease inhibitor
      workflow_question: What does Boltz-2 predict for this malaria-related protease
        and reference inhibitor-like ligand?
      interpretation_scope: Learning and early hypothesis generation only
      target_name: Plasmodium falciparum falcipain-2 cysteine protease
      target_family: falcipain-2 cysteine protease
      disease_area: malaria target exploration
      ligand_name: E-64 reference cysteine-protease inhibitor
      ligand_role: reference cysteine-protease inhibitor
      source_pdb: 3BPF
      source_pubchem_cid: '123985'
      protein_sequence_length: 241
      caveat: Boltz-2 outputs are computational structure and affinity-style predictions
        for hypothesis generation; they are not experimental binding, potency, selectivity,
        clinical, or efficacy evidence.
    integration_step: 0.01
- alias: falcipain_ligand_setup
  path: models/input_assembler
  parameters:
    workflow_name: Malaria Binding Workflow
    workflow_kind: single
    default_protein_sequence: QMNYEEVIKKYRGEENFDHAAYDWRLHSGVTPVKDQKNCGSCWAFSSIGSVESQYAIRKNKLITLSEQELVDCSFKNYGCNGGLINNAFEDMIELGGICPDGDYPYVSDAPNLCNIDRCTEKYGIKNYLSVPDNKLKEALRFLGPISISVAVSDDFAFYKEGIFDGECGDQLNHAVMLVGFGMKEIVNPLTKKGEKHYYYIIKNSWGQQWGERGFINIETDESGLMRKCGLGTDAFIPLIE
    default_ligand_smiles: CC(C)C[C@@H](C(=O)NCCCCN=C(N)N)NC(=O)[C@@H]1[C@H](O1)C(=O)O
    default_run_options:
      workflow_name: Malaria Binding Workflow
      workflow_context: Guided Boltz-2 known-example workflow for Plasmodium falciparum
        falcipain-2 cysteine protease and E-64 reference cysteine-protease inhibitor
      interpretation_scope: Learning and early hypothesis generation only
      target_name: Plasmodium falciparum falcipain-2 cysteine protease
      ligand_name: E-64 reference cysteine-protease inhibitor
      source_pdb: 3BPF
      source_pubchem_cid: '123985'
    integration_step: 0.01
- alias: boltz_boltz2_affinity_predictor
  path: models/core
  parameters:
    accelerator: gpu
    runtime_mode: managed
    use_msa_server: true
    output_format: mmcif
    override: true
    recycling_steps: 3
    sampling_steps: 200
    diffusion_samples: 1
- alias: malaria_prediction_interpreter
  path: models/interpreter
  parameters:
    workflow_name: Malaria Binding Workflow
    mode: single
    core_alias: boltz_boltz2_affinity_predictor
    caveat: Boltz-2 outputs are computational structure and affinity-style predictions
      for hypothesis generation; they are not experimental binding, potency, selectivity,
      clinical, or efficacy evidence.
    integration_step: 0.01
- alias: visualisation
  path: models/visualisation
  parameters:
    integration_step: 0.01
    source_alias: boltz_boltz2_affinity_predictor
    mode: boltz
    lab_title: 'Boltz Workflow: Malaria Binding'
    context_alias: malaria_target_context
    assembler_alias: falcipain_ligand_setup
    interpreter_alias: malaria_prediction_interpreter
io:
  inputs:
  - name: protein_sequence
    label: Falcipain-2 Sequence
    description: Amino-acid sequence for the curated Plasmodium falciparum falcipain-2
      target; maps directly to the Boltz-2 protein input.
    maps_to: falcipain_ligand_setup.protein_sequence
    value_type: string
    format: sequence
    required: false
    ui:
      control: textarea
      rows: 6
  - name: ligand_smiles
    label: E-64 Ligand SMILES
    description: SMILES string for the E-64 reference cysteine-protease inhibitor
      example; maps directly to the Boltz-2 ligand input.
    maps_to: falcipain_ligand_setup.ligand_smiles
    value_type: string
    format: smiles
    required: false
    ui:
      control: textarea
      rows: 3
  - name: msa_path
    label: Precomputed MSA Path
    description: Optional path to a precomputed MSA file; leave unset when the configured
      Boltz MSA server is used.
    maps_to: falcipain_ligand_setup.msa_path
    value_type: file
    format: a3m
    required: false
    file:
      accept:
      - .a3m
      - .fasta
      - .fa
    ui:
      control: file
  - name: use_msa_server
    label: Use MSA Server
    description: Use Boltz's MSA server instead of requiring a precomputed MSA file.
    maps_to: falcipain_ligand_setup.run_options.use_msa_server
    value_type: boolean
    default: true
  - name: sampling_steps
    label: Sampling Steps
    description: Number of Boltz sampling steps for structure generation.
    maps_to: falcipain_ligand_setup.run_options.sampling_steps
    value_type: integer
    default: 200
  - name: recycling_steps
    label: Recycling Steps
    description: Number of structure recycling steps.
    maps_to: falcipain_ligand_setup.run_options.recycling_steps
    value_type: integer
    default: 3
  - name: diffusion_samples
    label: Diffusion Samples
    description: Number of Boltz diffusion samples to generate.
    maps_to: falcipain_ligand_setup.run_options.diffusion_samples
    value_type: integer
    default: 1
  - name: output_format
    label: Output Format
    description: Structure artifact format emitted by Boltz.
    maps_to: falcipain_ligand_setup.run_options.output_format
    value_type: string
    default: mmcif
    allowed_values:
    - mmcif
    - pdb
  - name: run_options
    label: Boltz Run Options
    description: Optional structured controls for the Boltz workflow, including source
      metadata, sampling settings, and interpretation scope.
    maps_to: falcipain_ligand_setup.run_options
    value_type: record
    format: json
    required: false
    advanced: true
    ui:
      control: json
      rows: 6
  outputs:
  - name: scenario_context
    label: Workflow Scenario Context
    description: Source-backed target, ligand, use-case, provenance, and caveat context
      for this Boltz workflow.
    maps_to: malaria_target_context.scenario_context
  - name: assembled_boltz_request
    label: Assembled Boltz Request
    description: Traceable summary of the protein, ligand, MSA, and run options prepared
      for Boltz.
    maps_to: falcipain_ligand_setup.assembled_boltz_request
  - name: affinity_summary
    label: Affinity-Style Summary
    description: Parsed Boltz-2 binder probability and affinity-like outputs for this
      falcipain-ligand prediction.
    maps_to: boltz_boltz2_affinity_predictor.affinity_summary
  - name: confidence_summary
    label: Structure Confidence Summary
    description: Parsed Boltz-2 confidence outputs for the predicted falcipain-ligand
      complex.
    maps_to: boltz_boltz2_affinity_predictor.confidence_summary
  - name: structure_artifacts
    label: Predicted Complex Structure Artifacts
    description: File-backed predicted complex structures used by the 3D visualisation.
    maps_to: boltz_boltz2_affinity_predictor.structure_artifacts
  - name: run_metadata
    label: Boltz Run Metadata
    description: Runtime status, command metadata, logs, and caveats for the latest
      Boltz invocation.
    maps_to: boltz_boltz2_affinity_predictor.run_metadata
  - name: prediction_evidence
    label: Conservative Prediction Evidence
    description: Interpreted Boltz output evidence with request traceability and explicit
      scientific caveats.
    maps_to: malaria_prediction_interpreter.prediction_evidence
wiring:
- from: malaria_target_context.scenario_context
  to:
  - falcipain_ligand_setup.scenario_context
  - malaria_prediction_interpreter.scenario_context
  - visualisation.malaria_target_context_scenario_context
- from: falcipain_ligand_setup.protein_sequence
  to:
  - boltz_boltz2_affinity_predictor.protein_sequence
- from: falcipain_ligand_setup.ligand_smiles
  to:
  - boltz_boltz2_affinity_predictor.ligand_smiles
- from: falcipain_ligand_setup.msa_path
  to:
  - boltz_boltz2_affinity_predictor.msa_path
- from: falcipain_ligand_setup.run_options
  to:
  - boltz_boltz2_affinity_predictor.run_options
- from: falcipain_ligand_setup.assembled_boltz_request
  to:
  - malaria_prediction_interpreter.assembled_boltz_request
  - visualisation.falcipain_ligand_setup_assembled_boltz_request
- from: boltz_boltz2_affinity_predictor.affinity_summary
  to:
  - visualisation.boltz_boltz2_affinity_predictor_affinity_summary
  - malaria_prediction_interpreter.boltz_boltz2_affinity_predictor_affinity_summary
- from: boltz_boltz2_affinity_predictor.confidence_summary
  to:
  - visualisation.boltz_boltz2_affinity_predictor_confidence_summary
  - malaria_prediction_interpreter.boltz_boltz2_affinity_predictor_confidence_summary
- from: boltz_boltz2_affinity_predictor.structure_artifacts
  to:
  - visualisation.boltz_boltz2_affinity_predictor_structure_artifacts
  - malaria_prediction_interpreter.boltz_boltz2_affinity_predictor_structure_artifacts
- from: boltz_boltz2_affinity_predictor.run_metadata
  to:
  - visualisation.boltz_boltz2_affinity_predictor_run_metadata
  - malaria_prediction_interpreter.boltz_boltz2_affinity_predictor_run_metadata
- from: malaria_prediction_interpreter.prediction_evidence
  to:
  - visualisation.malaria_prediction_interpreter_prediction_evidence
runtime:
  python_version: '3.10'
  duration: 0.01
  communication_step: 0.01
  settle_steps: 1
  initial_inputs: {}
